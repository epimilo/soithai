<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOCA - 3D Overlapping Fold Animation</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            /* Tạo chiều sâu 3D cho toàn bộ bối cảnh */
            perspective: 2500px;
        }

        .scene {
            position: relative;
            /* Hơi nghiêng góc nhìn một chút để thấy rõ hiệu ứng 3D */
            transform: rotateX(8deg) rotateY(-5deg);
            transform-style: preserve-3d;
        }

        /* Khung cơ sở (Trang giữa) */
        .brochure-center {
            position: relative;
            width: 32vw;
            max-width: 400px;
            aspect-ratio: 1 / 1.414; /* Tỷ lệ A4 chuẩn */
            transform-style: preserve-3d;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Cấu trúc mặt trước / mặt sau cho từng trang */
        .panel {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Ẩn mặt sau khi lật */
            top: 0;
            left: 0;
        }

        .face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Mặt sau luôn bị xoay 180 độ mặc định */
        .face.back {
            transform: rotateY(180deg);
        }

        /* ================= CÁC BẢN LỀ (HINGES) ================= */
        
        /* Bản lề trái (Neo vào cạnh trái của trang giữa) */
        .hinge-left {
            position: absolute;
            width: 100%;
            height: 100%;
            left: -100%;
            transform-origin: right center;
            transform-style: preserve-3d;
            animation: foldLeft 10s ease-in-out infinite;
        }

        /* Bản lề phải (Neo vào cạnh phải của trang giữa) */
        .hinge-right {
            position: absolute;
            width: 100%;
            height: 100%;
            right: -100%;
            transform-origin: left center;
            transform-style: preserve-3d;
            animation: foldRight 10s ease-in-out infinite;
        }


        /* ================= KEYFRAMES ANIMATION ================= */
        /*
           Tổng thời gian: 10s
           - 0s tới 1.5s: Đóng nguyên
           - 1.5s tới 3s: Cánh phải mở ra
           - 3s tới 4.5s: Cánh trái mở ra
           - 4.5s tới 7s: Dừng lại ngắm mặt trong
           - 7s tới 8.5s: Cánh trái đóng lại trước
           - 8.5s tới 10s: Cánh phải đóng lại đè lên trên
        */

        @keyframes foldLeft {
            0%, 15% { transform: rotateY(180deg) translateZ(1px); } /* Đóng */
            30%, 70% { transform: rotateY(0deg) translateZ(0px); } /* Mở */
            85%, 100% { transform: rotateY(180deg) translateZ(1px); } /* Đóng */
        }

        @keyframes foldRight {
            0%, 15% { transform: rotateY(-180deg) translateZ(3px); } /* Đóng & nằm trên cùng (Z=3) */
            30% { transform: rotateY(-180deg) translateZ(3px); } /* Đợi cánh trái... */
            45%, 70% { transform: rotateY(0deg) translateZ(0px); } /* Mở */
            85% { transform: rotateY(0deg) translateZ(0px); } /* Đợi cánh trái đóng... */
            100% { transform: rotateY(-180deg) translateZ(3px); } /* Đóng & nằm trên cùng */
        }
        
        /* Chút hiệu ứng đổ bóng ở giữa gáy */
        .face.front::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.15) 0%, rgba(255,255,255,0) 10%, rgba(255,255,255,0) 90%, rgba(0,0,0,0.15) 100%);
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div class="scene">
        <!-- TRANG GIỮA (BASE) -->
        <div class="brochure-center">
            
            <div class="panel">
                <!-- Mặt trong: Đoạn giữa chữ "ngkok..." -->
                <div class="face front"><img src="Untitled-1-3.jpg" alt="Center Inside"></div>
                <!-- Mặt ngoài (Mặt lưng của brochure) -->
                <div class="face back"><img src="Untitled-1-5.jpg" alt="Center Outside"></div>
            </div>

            <!-- CÁNH BÊN TRÁI -->
            <div class="hinge-left">
                <div class="panel">
                    <!-- Mặt trong: Chữ "Moca Bar..." -->
                    <div class="face front"><img src="Untitled-1-2.jpg" alt="Left Inside"></div>
                    <!-- Mặt ngoài (khi gập lại nó phơi ra ngoài) -->
                    <div class="face back"><img src="BIA MOCA [Recovered]xxxhdpiii.jpg" alt="Left Outside"></div>
                </div>
            </div>

            <!-- CÁNH BÊN PHẢI -->
            <div class="hinge-right">
                <div class="panel">
                    <!-- Mặt trong: Chữ "...không ranh giới" -->
                    <div class="face front"><img src="Untitled-1-4.jpg" alt="Right Inside"></div>
                    <!-- Mặt ngoài (khi gập lại nó phơi ra ngoài) -->
                    <div class="face back"><img src="BIA MOCA [Recovered]xxxhdpiii_2.jpg" alt="Right Outside"></div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>

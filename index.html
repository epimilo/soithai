<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gate Fold 4-panel brochure mockup for GitHub Pages" />
    <title>MOCA - Gate Fold 4 Panel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="gatefold" aria-label="4-panel gate fold brochure">
        <div class="flap flap-left">
          <div class="face front">
            <img src="PIC/BIA%20MOCA%20%5BRecovered%5Dxxxhdpiii.jpeg" alt="Bìa chữ Chang of Art" />
          </div>
          <div class="face back">
            <img src="PIC/Untitled-1-2.png" alt="Trang 1-2" />
          </div>
        </div>

        <div class="panel panel-left">
          <img src="PIC/Untitled-1-3.png" alt="Trang 1-3" />
        </div>

        <div class="panel panel-right">
          <img src="PIC/Untitled-1-4.png" alt="Trang 1-4" />
        </div>

        <div class="flap flap-right">
          <div class="face front">
            <img src="PIC/BIA%20MOCA%20%5BRecovered%5Dxxxhdpiii%20%281%29.jpeg" alt="Bìa Hoa Sen" />
          </div>
          <div class="face back">
            <img src="PIC/Untitled-1-5.png" alt="Trang 1-5" />
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOCA - 4 Panel Gate Fold</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            perspective: 2000px;
        }

        .scene {
            transform: rotateX(10deg) rotateY(-5deg);
            transform-style: preserve-3d;
        }

        .center-board {
            position: relative;
            display: flex;
            width: 44vw; 
            max-width: 600px;
            aspect-ratio: 2 / 1.414; 
            background: #fff;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            transform-style: preserve-3d;
        }

        .center-panel {
            width: 50%;
            height: 100%;
        }
        .center-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .center-board::after {
            content: "";
            position: absolute;
            left: 50%; top: 0; width: 2px; height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.2), rgba(0,0,0,0));
            transform: translateX(-50%);
        }

        .flap {
            position: absolute;
            width: 50%; 
            height: 100%;
            top: 0;
            transform-style: preserve-3d;
        }

        .flap-left {
            left: -50%;
            transform-origin: right center; 
            animation: foldLeft 8s ease-in-out infinite;
        }

        .flap-right {
            right: -50%;
            transform-origin: left center; 
            animation: foldRight 8s ease-in-out infinite;
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            top: 0; left: 0;
        }
        .face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .face.back {
            transform: rotateY(180deg);
        }

        .face.front::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.05);
            pointer-events: none;
        }

        @keyframes foldLeft {
            0%, 20% { transform: rotateY(180deg) translateZ(1px); }
            40%, 70% { transform: rotateY(0deg) translateZ(0px); }
            90%, 100% { transform: rotateY(180deg) translateZ(1px); }
        }

        @keyframes foldRight {
            0%, 20% { transform: rotateY(-180deg) translateZ(1px); }
            40%, 70% { transform: rotateY(0deg) translateZ(0px); }
            90%, 100% { transform: rotateY(-180deg) translateZ(1px); }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="center-board">
            <!-- Mặt trong: Giữa Trái & Giữa Phải -->
            <div class="center-panel"><img src="Untitled-1-3.jpg" alt="Center Left"></div>
            <div class="center-panel"><img src="Untitled-1-4.jpg" alt="Center Right"></div>

            <!-- CÁNH GẬP TRÁI -->
            <div class="flap flap-left">
                <div class="face front"><img src="Untitled-1-2.jpg" alt="Flap Left Inside"></div>
                <div class="face back"><img src="BIA MOCA [Recovered]xxxhdpiii.jpg" alt="Cover Left"></div>
            </div>

            <!-- CÁNH GẬP PHẢI -->
            <div class="flap flap-right">
                <div class="face front"><img src="Untitled-1-5.jpg" alt="Flap Right Inside"></div>
                <div class="face back"><img src="BIA MOCA [Recovered]xxxhdpiii_2.jpg" alt="Cover Right"></div>
            </div>
        </div>
    </div>

</body>
</html>
